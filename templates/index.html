<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Linguahe - Linguistic Analyzer</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  />

  <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='icon.png') }}"
  />
</head>

<body class="bg-slate-100">

<div class="main-content">

  <!-- HEADER -->
  <header class="header-bar">
    Linguahe
  </header>

  <div class="container mx-auto px-4 py-6">

    <!-- MAIN GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- INPUT SECTION -->
      <div class="card-box">

        <div class="flex justify-between items-center mb-4">
          <p class="text-sm font-bold text-sky-600 uppercase">
            Speech / Text Input
          </p>
        </div>

        <div class="transcript-container">
          <textarea
            id="inputText"
            class="textarea-main"
            placeholder="Record audio or enter Tagalog speech here..."
          ></textarea>
        </div>

        <div class="mt-4 flex items-center gap-2">
          <input
            type="checkbox"
            id="noiseToggle"
            class="w-4 h-4"
          />

          <label
            for="noiseToggle"
            class="text-xs font-semibold text-gray-600"
          >
            Enable Noise Suppression
          </label>
        </div>

      </div>

      <!-- OUTPUT SECTION -->
      <div class="card-box">

        <p class="text-sm font-bold text-sky-600 mb-4 uppercase">
          Linguistic Analysis Results
        </p>

        <div
          id="explanationBox"
          class="explanation-box"
        >
          <p class="text-gray-400 italic">
            Awaiting speech input...
          </p>
        </div>

      </div>

    </div>

    <!-- CONTROL PANEL -->
    <div class="flex flex-col items-center gap-4 mt-10">

      <button
        id="micBtn"
        class="mic-button"
      >
        🎤
      </button>

      <p
        id="statusText"
        class="text-sm text-gray-500 font-bold"
      >
        Tap to Record (15 Seconds Max)
      </p>

      <div class="flex gap-4 mt-2">

        <button
          id="downloadBtn"
          class="bg-sky-100 text-sky-700 px-6 py-2 rounded-lg text-sm font-bold hover:bg-sky-200 transition"
        >
          Download Report
        </button>

        <button
          id="clearBtn"
          class="text-gray-400 hover:text-red-500 text-sm font-bold"
        >
          Clear
        </button>

      </div>

    </div>

  </div>

</div>

<!-- FOOTER -->
<footer class="footer-bar pb-10">
  © 2026 Linguahe Team
</footer>

<script>

let recorder;
let audioChunks = [];

const micBtn = document.getElementById("micBtn");
const statusText = document.getElementById("statusText");

const inputArea = document.getElementById("inputText");
const explanationBox = document.getElementById("explanationBox");


// ======================================================
// MAIN ANALYSIS EXECUTION
// ======================================================

async function executeAnalysis(
  text,
  audioFeatures = {}
) {

  if (!text || text.trim() === "") {
    return;
  }

  statusText.innerText = "Analyzing linguistic features...";

  try {

    const response = await fetch("/analyze", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        conversation: text,

        audio_features: audioFeatures

      })

    });

    const data = await response.json();

    explanationBox.innerHTML = data.explanation;

    statusText.innerText = "Analysis Complete";

  }

  catch (error) {

    console.error(error);

    statusText.innerText =
      "Analysis engine failure.";

  }

}


// ======================================================
// AUDIO RECORDING
// ======================================================

async function startRecording() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    recorder = new MediaRecorder(stream);

    audioChunks = [];

    micBtn.innerHTML = "⏹️";

    micBtn.classList.add("recording");

    statusText.innerText =
      "Recording speech...";

    recorder.ondataavailable = (event) => {

      audioChunks.push(event.data);

    };

    recorder.onstop = async () => {

      micBtn.innerHTML = "🎤";

      micBtn.classList.remove("recording");

      statusText.innerText =
        "Transcribing audio...";

      const blob = new Blob(audioChunks, {
        type: "audio/wav"
      });

      const formData = new FormData();

      formData.append("audio", blob);

      formData.append(
        "noise_suppression",
        document.getElementById("noiseToggle").checked
      );

      try {

        const response =
          await fetch("/transcribe", {

            method: "POST",

            body: formData

          });

        const result =
          await response.json();

        if (
          result.original_text &&
          result.original_text.trim() !== ""
        ) {

          inputArea.value =
            result.original_text;

          await executeAnalysis(
            result.original_text,
            result
          );

        }

        else {

          statusText.innerText =
            "Speech not detected.";

        }

      }

      catch (error) {

        console.error(error);

        statusText.innerText =
          "Transcription failure.";

      }

    };

    recorder.start();

    // AUTO STOP AFTER 15 SECONDS
    setTimeout(() => {

      if (
        recorder &&
        recorder.state === "recording"
      ) {

        recorder.stop();

      }

    }, 15000);

  }

  catch (error) {

    alert(
      "Microphone permission denied."
    );

  }

}


// ======================================================
// MIC BUTTON
// ======================================================

micBtn.addEventListener("click", () => {

  if (
    recorder &&
    recorder.state === "recording"
  ) {

    recorder.stop();

  }

  else {

    startRecording();

  }

});


// ======================================================
// MANUAL TEXT INPUT
// ======================================================

inputArea.addEventListener("change", () => {

  executeAnalysis(
    inputArea.value,
    {}
  );

});


// ======================================================
// CLEAR BUTTON
// ======================================================

document.getElementById("clearBtn")
.addEventListener("click", () => {

  location.reload();

});


// ======================================================
// DOWNLOAD REPORT
// ======================================================

document.getElementById("downloadBtn")
.addEventListener("click", () => {

  const transcript = inputArea.value;

  if (!transcript) {

    alert("No transcript available.");

    return;

  }

  const reportText =
    explanationBox.innerText;

  const finalReport =

`LINGUAHE SPEECH ANALYSIS REPORT

Generated:
${new Date().toLocaleString()}

======================================

TRANSCRIPT

${transcript}

======================================

LINGUISTIC ANALYSIS

${reportText}

======================================

System:
ANN + SBERT Hybrid Linguistic Engine
`;

  const blob = new Blob(
    [finalReport],
    { type: "text/plain" }
  );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    `Linguahe_Report_${Date.now()}.txt`;

  a.click();

  URL.revokeObjectURL(url);

});

</script>

</body>
</html>
